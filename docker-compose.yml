services:

  postgres-db:
    image: postgres:15-alpine
    container_name: lab_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin_inventario
      POSTGRES_PASSWORD: SecretPassword2026
      POSTGRES_DB: inventario_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lab_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://admin_inventario:SecretPassword2026@postgres-db:5432/inventario_db?schema=public"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres-db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lab_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
